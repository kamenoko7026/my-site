<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Log 💕</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

<header>
    <h1>💕 Love Log</h1>
    <p>あの日の幸せを、未来の自分へ。</p>
</header>

<main>

<section class="post-form">
	<h2>今日の出来事</h2>

	<!-- 🔻 日付選択を追加 🔻 -->
	<input type="date" id="postDate">

	<textarea id="postText"
		placeholder="今日はどんな幸せがありましたか？">
	</textarea>

	<!-- 🔻 画像アップロード領域を追加 🔻 -->
	<div class="image-upload-area">
		<label for="imageInput" class="image-label">📷 写真を追加する</label>
		<input type="file" id="imageInput" accept="image/*">
		<div id="imagePreviewContainer" class="image-preview-container" style="display: none;">
			<img id="imagePreview" src="" alt="プレビュー">
			<button type="button" id="removeImageBtn" class="remove-image-btn">✕</button>
		</div>
	</div>

	<input type="text"
		id="tagInput"
		placeholder="タグ（例：デート,LINE,電話）">

	<div class="options">
		<label>
			気分
			<select id="mood">
				<option>🥰</option>
				<option>😊</option>
				<option>❤️</option>
				<option>😍</option>
				<option>😭</option>
				<option>😆</option>
				<option>😌</option>
			</select>
		</label>

		<label class="favorite">
			<input type="checkbox" id="favorite">
			⭐ お気に入り
		</label>
	</div>

	<button id="saveButton">保存する</button>
</section>

<section class="search">
    <input type="text"
        id="searchInput"
        placeholder="🔍 思い出を検索">
</section>

<section class="post-list-section">
    <h2>思い出一覧</h2>
    <div id="postList">
        <!-- JavaScriptで投稿が追加されます -->
    </div>
</section>

</main>

<section class="backup-section">
    <h2>バックアップ</h2>

    <button id="exportButton">💾 バックアップを書き出す</button>

    <br><br>

    <input type="file" id="importFile" accept=".json">

    <button id="importButton">📂 バックアップを復元する</button>
</section>

<footer>
    <p>Made with ❤️ for your memories.</p>
</footer>

</body>
</html>
